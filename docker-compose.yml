version: "3.9"

services:
  db:
    image: mysql:8.4
    container_name: db
    restart: unless-stopped
    # env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: ${TZ}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "13306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        - TZ=${TZ}
    container_name: movie_backend
    restart: always
    env_file: .env
    volumes:
      - ./backend:/app # 코드 hot-reload
    ports:
      - "8000:8000"
    depends_on:
      - db

  adminer: # Workbench 대신 웹 UI ( http://localhost:8080 )
    image: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  db_data:
